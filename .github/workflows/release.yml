name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate release tag
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          metadata = tomllib.loads(Path("pyproject.toml").read_text())
          package_version = metadata["project"]["version"]
          release_tag = os.environ["GITHUB_REF_NAME"]
          expected_tag = f"v{package_version}"

          if ".dev" in package_version:
              raise SystemExit("Refusing to publish a development version to PyPI.")
          if release_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {release_tag!r} does not match package version {expected_tag!r}."
              )
          PY

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wxenergy
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          name: release-dists
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
