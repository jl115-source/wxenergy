name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests docs examples

      - name: Ruff format
        run: ruff format --check src tests docs examples

      - name: Type check
        run: mypy src/wxenergy

      - name: Run example
        run: python examples/basic_workflow.py

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: pytest -q --cov=wxenergy --cov-report=term-missing --cov-fail-under=90

  minimum-dependencies:
    name: Minimum supported dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install minimum runtime dependencies
        run: |
          python -m pip install \
            "numpy==1.24.4" \
            "pandas==1.5.3" \
            "xarray==2023.1.0" \
            "dask[array]>=2023.1" \
            "hypothesis>=6.100" \
            "pytest>=8" \
            "scipy>=1.10"
          python -m pip install -e . --no-deps

      - name: Test minimum dependency set
        run: pytest -q

  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Check installed dependencies
        run: python -m pip check

      - name: Smoke test installed package
        run: |
          cd /tmp
          python -c "import wxenergy; assert wxenergy.__version__ == '0.2.0.dev0'; print(wxenergy.__version__)"

  docs:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs dependencies
        run: python -m pip install -e ".[docs]"

      - name: Build docs with warnings as errors
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
