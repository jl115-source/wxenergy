name: Bug report
description: Report incorrect behavior or a regression
title: "[BUG] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve wxenergy. Please include a minimal reproducible example where possible.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproducible example
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: wxenergy version
      placeholder: 0.2.0.dev0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python / xarray versions
      placeholder: Python 3.12, xarray 2026.x
    validations:
      required: true
